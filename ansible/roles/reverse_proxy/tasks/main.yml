---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Deploy LMS reverse proxy config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/lms
  notify: Restart Nginx

- name: Enable the LMS site
  file:
    src: /etc/nginx/sites-available/lms
    dest: /etc/nginx/sites-enabled/lms
    state: link
  notify: Restart Nginx

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart Nginx

- name: Ensure Nginx is running and enabled
  service:
    name: nginx
    state: started
    enabled: true